<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#FF5C00" />
    </linearGradient>
    
    <!-- Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <drop-shadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="20" />
  <rect width="99%" height="98%" x="0.5%" y="1%" fill="none" stroke="#334155" stroke-width="1" rx="20" />

  <!-- Header -->
  <g transform="translate(40, 45)">
    <text font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Low-Fidelity Blueprinting &amp; Flow Skeleton</text>
    <text font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" y="20">Focusing on wallet structure, navigation, and money transfer hierarchy</text>
    <line x1="0" y1="32" x2="720" y2="32" stroke="#334155" stroke-width="1" />
  </g>

  <!-- Wireframe Screen 1: Dashboard -->
  <g transform="translate(140, 110)" filter="url(#dropShadow)">
    <!-- Device Frame -->
    <rect width="210" height="290" fill="#0F172A" rx="24" stroke="#475569" stroke-width="2" />
    <!-- Speaker & Camera -->
    <rect x="75" y="8" width="60" height="4" rx="2" fill="#334155" />
    <circle cx="60" cy="10" r="3" fill="#334155" />
    
    <!-- Status Bar -->
    <rect x="15" y="22" width="20" height="6" rx="1" fill="#334155" />
    <rect x="160" y="22" width="30" height="6" rx="1" fill="#334155" />
    
    <!-- App Header -->
    <circle cx="32" cy="48" r="12" fill="none" stroke="#475569" stroke-width="1" />
    <rect x="52" y="44" width="70" height="8" rx="2" fill="#334155" />
    <rect x="160" y="42" width="30" height="12" rx="4" fill="none" stroke="#475569" stroke-width="1" />

    <!-- Wallet Card (Multi-currency selector) -->
    <rect x="15" y="70" width="180" height="80" rx="12" fill="none" stroke="#475569" stroke-dasharray="3 3" stroke-width="1.5" />
    <rect x="30" y="85" width="50" height="6" rx="1.5" fill="#475569" />
    <rect x="30" y="100" width="120" height="18" rx="3" fill="#334155" />
    <rect x="30" y="125" width="70" height="6" rx="1.5" fill="#334155" />
    <!-- Wallet switch button -->
    <rect x="155" y="85" width="25" height="12" rx="3" fill="#334155" />

    <!-- Quick Actions -->
    <g transform="translate(15, 165)">
      <circle cx="20" cy="15" r="15" fill="none" stroke="#475569" stroke-width="1" />
      <rect x="5" y="36" width="30" height="4" rx="1" fill="#334155" />

      <circle cx="70" cy="15" r="15" fill="none" stroke="#475569" stroke-width="1" />
      <rect x="55" y="36" width="30" height="4" rx="1" fill="#334155" />

      <circle cx="120" cy="15" r="15" fill="none" stroke="#475569" stroke-width="1" />
      <rect x="105" y="36" width="30" height="4" rx="1" fill="#334155" />

      <circle cx="160" cy="15" r="15" fill="none" stroke="#475569" stroke-width="1" />
      <rect x="145" y="36" width="30" height="4" rx="1" fill="#334155" />
    </g>

    <!-- Recent Transactions -->
    <rect x="15" y="225" width="80" height="8" rx="2" fill="#475569" />
    
    <g transform="translate(15, 245)">
      <circle cx="10" cy="10" r="10" fill="#334155" />
      <rect x="28" y="4" width="70" height="6" rx="1.5" fill="#334155" />
      <rect x="28" y="14" width="40" height="4" rx="1" fill="#1E293B" />
      <rect x="140" y="7" width="30" height="6" rx="1.5" fill="#334155" />
    </g>
  </g>

  <!-- Wireframe Screen 2: Transfer Interface -->
  <g transform="translate(450, 110)" filter="url(#dropShadow)">
    <!-- Device Frame -->
    <rect width="210" height="290" fill="#0F172A" rx="24" stroke="#475569" stroke-width="2" />
    <!-- Speaker & Camera -->
    <rect x="75" y="8" width="60" height="4" rx="2" fill="#334155" />
    <circle cx="60" cy="10" r="3" fill="#334155" />

    <!-- App Header -->
    <path d="M20 48l6-6-6-6" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <rect x="40" y="44" width="80" height="8" rx="2" fill="#475569" />

    <!-- Send Form Box -->
    <text font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569" x="20" y="75">SOURCE WALLET</text>
    <rect x="15" y="82" width="180" height="35" rx="8" fill="none" stroke="#334155" stroke-width="1.5" />
    <circle cx="35" cy="100" r="8" fill="#334155" />
    <rect x="52" y="97" width="40" height="6" rx="1.5" fill="#475569" />
    <rect x="140" y="94" width="40" height="12" rx="3" fill="#334155" />

    <!-- Target Form Box -->
    <text font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569" x="20" y="137">RECIPIENT &amp; WALLET</text>
    <rect x="15" y="144" width="180" height="35" rx="8" fill="none" stroke="#334155" stroke-width="1.5" />
    <circle cx="35" cy="162" r="8" fill="#334155" />
    <rect x="52" y="159" width="55" height="6" rx="1.5" fill="#475569" />
    <rect x="140" y="156" width="40" height="12" rx="3" fill="#334155" />

    <!-- Transfer Amount Field -->
    <text font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569" x="20" y="198">AMOUNT TO SEND</text>
    <rect x="15" y="205" width="180" height="40" rx="8" fill="none" stroke="url(#orangeGrad)" stroke-width="1.5" />
    <rect x="30" y="217" width="60" height="16" rx="3" fill="#334155" />
    <rect x="145" y="221" width="35" height="8" rx="2" fill="#475569" />

    <!-- Primary Button (Action CTA) -->
    <rect x="15" y="255" width="180" height="24" rx="8" fill="url(#orangeGrad)" opacity="0.3" stroke="url(#orangeGrad)" stroke-width="1" />
    <rect x="70" y="263" width="70" height="8" rx="2" fill="#FFF" />
  </g>

  <!-- Connective Arrows -->
  <path d="M370 240 h 60 m -10 -5 l 10 5 -10 5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" />
</svg>
